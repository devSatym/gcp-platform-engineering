# Tempo is the shared, OTLP-native trace backend. It replaces a platform-wide
# Jaeger dependency while Grafana continues to provide the trace query UI.
tempo:
  reportingEnabled: false
  retention: 48h
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write
    processor:
      service_graphs: {}
      span_metrics: {}
  # Metrics-generator processors must be enabled per tenant. This single-tenant
  # platform applies the generic RED and service-graph processors by default;
  # it intentionally adds no workload-specific dimensions.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

persistence:
  enabled: true
  size: 20Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Prometheus scrapes Tempo's backend and metrics-generator health. Grafana
# uses the same service as its trace datasource.
serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack
