# Shared Kubernetes metrics, Prometheus, and Grafana. This is intentionally
# workload-neutral: any workload can opt in through standard ServiceMonitor or
# PodMonitor resources without modifying this platform component.
defaultRules:
  create: true

grafana:
  defaultDashboardsEnabled: true
  defaultDashboardsEditable: false
  # The dev deployment has one ReadWriteOnce PVC. Recreate avoids a surge
  # rollout that leaves a replacement pod waiting for the disk still mounted by
  # its predecessor.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      isDefault: false
      jsonData:
        httpMethod: GET
  dashboards:
    platform:
      golden-signals:
        json: |
          {
            "title": "Platform / Service Golden Signals",
            "uid": "platform-golden-signals",
            "schemaVersion": 39,
            "tags": ["platform", "generic", "golden-signals"],
            "timezone": "browser",
            "time": {"from": "now-6h", "to": "now"},
            "templating": {
              "list": [
                {
                  "name": "namespace",
                  "label": "Namespace",
                  "type": "query",
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "query": "label_values(kube_pod_info, namespace)",
                  "includeAll": true,
                  "allValue": ".*",
                  "multi": true,
                  "refresh": 2
                },
                {
                  "name": "datasource",
                  "label": "Metrics datasource",
                  "type": "datasource",
                  "query": "prometheus"
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "type": "timeseries",
                "title": "HTTP request rate (when emitted)",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
                "targets": [{
                  "refId": "A",
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "expr": "sum(rate(http_server_request_duration_seconds_count{namespace=~\"$namespace\"}[$__rate_interval]))",
                  "legendFormat": "requests/s"
                }]
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "HTTP 5xx ratio (when emitted)",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
                "targets": [{
                  "refId": "A",
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "expr": "sum(rate(http_server_request_duration_seconds_count{namespace=~\"$namespace\",http_response_status_code=~\"5..\"}[$__rate_interval])) / sum(rate(http_server_request_duration_seconds_count{namespace=~\"$namespace\"}[$__rate_interval]))",
                  "legendFormat": "5xx ratio"
                }]
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "HTTP p95 latency (when emitted)",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
                "targets": [{
                  "refId": "A",
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{namespace=~\"$namespace\"}[$__rate_interval])))",
                  "legendFormat": "p95"
                }]
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Running pods by namespace",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
                "targets": [{
                  "refId": "A",
                  "datasource": {"type": "prometheus", "uid": "${datasource}"},
                  "expr": "sum by (namespace) (kube_pod_status_phase{namespace=~\"$namespace\",phase=\"Running\"})",
                  "legendFormat": "{{namespace}}"
                }]
              }
            ]
          }

prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
