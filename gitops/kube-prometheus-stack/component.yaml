component:
  name: kube-prometheus-stack
  namespace: observability
  syncWave: "0"
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "88.3.0"
  values: gitops/kube-prometheus-stack/values.yaml
  # Argo CD renders the Helm chart without Helm's live-cluster Secret lookup.
  # Preserve this generated password and its pod-template checksum so they
  # cannot drift from Grafana's persistent database or trigger a rollout on a
  # future reconciliation.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      namespace: observability
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: observability
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
