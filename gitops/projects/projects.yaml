# ArgoCD projects define the ownership boundary between platform services and
# arbitrary workloads. The repository URL is intentionally a placeholder.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Shared cluster services managed by the platform team.
  sourceRepos:
    - https://github.com/replace-with-owner/replace-with-repository.git
    - https://charts.external-secrets.io
    - https://kubernetes-sigs.github.io/metrics-server
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
  destinations:
    - namespace: platform-system
      server: '*'
    - namespace: kube-system
      server: '*'
    - namespace: observability
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Arbitrary Helm-based microservice workloads.
  sourceRepos:
    - https://github.com/replace-with-owner/replace-with-repository.git
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: ArgoCD bootstrap resources only.
  sourceRepos:
    - https://github.com/replace-with-owner/replace-with-repository.git
  destinations:
    - namespace: argocd
      server: '*'
  clusterResourceWhitelist:
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
    - group: ''
      kind: Namespace
