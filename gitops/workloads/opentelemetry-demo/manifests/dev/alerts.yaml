apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opentelemetry-demo-observability
  namespace: opentelemetry-demo-dev
  labels:
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  groups:
    - name: opentelemetry-demo.observability
      interval: 30s
      rules:
        - alert: OpenTelemetryDemoCheckoutErrorRateHigh
          expr: |
            (
              (sum(rate(traces_spanmetrics_calls_total{service="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[2m])) or vector(0))
              /
              clamp_min(sum(rate(traces_spanmetrics_calls_total{service="checkout",span_kind="SPAN_KIND_SERVER"}[2m])), 0.001)
            ) > 0.20
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: OpenTelemetry Demo checkout errors are elevated
            description: Checkout server spans exceeded a 20% error ratio for two minutes. The observed healthy baseline was 0%; paymentFailure reached 53% during validation.
            runbook_url: https://github.com/devSatym/gcp-platform-engineering/blob/main/docs/runbooks/opentelemetry-demo-observability.md
        - alert: OpenTelemetryDemoIngressTrafficAbsent
          expr: |
            sum(
              rate(
                traces_spanmetrics_calls_total{service="frontend-proxy",span_kind="SPAN_KIND_SERVER"}[5m]
              )
            ) < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenTelemetry Demo ingress traffic is unexpectedly absent
            description: The observed Locust baseline was approximately 8--10 ingress requests per second. Fewer than one request per second for five minutes indicates missing synthetic traffic or ingress telemetry.
            runbook_url: https://github.com/devSatym/gcp-platform-engineering/blob/main/docs/runbooks/opentelemetry-demo-observability.md
        - alert: OpenTelemetryDemoCriticalDeploymentUnavailable
          expr: |
            min by (deployment) (
              kube_deployment_status_replicas_available{
                namespace="opentelemetry-demo-dev",
                deployment=~"frontend|frontend-proxy|checkout|payment|load-generator"
              }
            ) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenTelemetry Demo critical deployment is unavailable
            description: A critical demo deployment has had no available replica for five minutes.
            runbook_url: https://github.com/devSatym/gcp-platform-engineering/blob/main/docs/runbooks/opentelemetry-demo-observability.md
