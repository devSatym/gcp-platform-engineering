apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-dashboards
  namespace: opentelemetry-demo-dev
  labels:
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: opentelemetry-demo
    grafana_dashboard: "1"
data:
  application-overview.json: |
    {
      "title": "OpenTelemetry Demo / Application Overview",
      "uid": "opentelemetry-demo-application",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "tags": ["opentelemetry-demo", "workload", "traces", "metrics"],
      "time": {"from": "now-30m", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Metrics datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Ingress request rate",
          "description": "Observed Tempo span metrics for the frontend-proxy ingress server span.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"frontend-proxy\",span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
            "legendFormat": "requests/s"
          }]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Checkout error ratio",
          "description": "Server spans marked STATUS_CODE_ERROR. paymentFailure reached 53% during the observed two-minute degraded window and was 0% when healthy.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "(sum(rate(traces_spanmetrics_calls_total{service=\"checkout\",span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(traces_spanmetrics_calls_total{service=\"checkout\",span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])), 0.001)",
            "legendFormat": "error ratio"
          }]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Checkout p95 server latency",
          "description": "p95 of the observed Tempo span-metrics latency histogram for the checkout server operation.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"checkout\",span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
            "legendFormat": "p95"
          }]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Server span rate by service",
          "description": "Which instrumented services are handling inbound work, based on generic Tempo span metrics.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
            "legendFormat": "{{service}}"
          }]
        }
      ]
    }
  kubernetes-overview.json: |
    {
      "title": "OpenTelemetry Demo / Kubernetes Overview",
      "uid": "opentelemetry-demo-kubernetes",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "tags": ["opentelemetry-demo", "workload", "kubernetes"],
      "time": {"from": "now-30m", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Metrics datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Pod CPU usage",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"opentelemetry-demo-dev\",container!=\"\",image!=\"\"}[$__rate_interval]))",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Pod working-set memory",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"opentelemetry-demo-dev\",container!=\"\",image!=\"\"})",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Container restarts",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"opentelemetry-demo-dev\"}[$__rate_interval]))",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Critical deployment replicas available",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
          "targets": [{
            "refId": "A",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "expr": "kube_deployment_status_replicas_available{namespace=\"opentelemetry-demo-dev\",deployment=~\"frontend|frontend-proxy|checkout|payment|load-generator\"}",
            "legendFormat": "{{deployment}}"
          }]
        }
      ]
    }
