# =============================================================================
# gitops/workloads/opentelemetry-demo/values/prod.yaml
#
# Production environment overrides — layered on top of base.yaml.
# Goal: Maximum resilience, zone-spread HA, cost-controlled load testing.
#
# Key characteristics:
#   - 3 replicas for Tier 1 (one per zone — zone HA)
#   - Pod anti-affinity to spread replicas across zones
#   - Load generator DISABLED — enable only for controlled production tests
#   - Shared platform observability; no duplicate embedded stack
#   - Warning/Error log level only
# =============================================================================

default:
  envOverrides:
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name=prod,service.namespace=opentelemetry-demo"

components:
  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 1 — 3 replicas with zone spread
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    replicas: 3
    schedulingRules:
      nodeSelector:
        workload: general
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: frontend

  frontend-proxy:
    replicas: 3
    schedulingRules:
      nodeSelector:
        workload: general

  cart:
    replicas: 3

  checkout:
    replicas: 3

  payment:
    replicas: 3
    schedulingRules:
      nodeSelector:
        workload: general

  product-catalog:
    replicas: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 2 — 2 replicas for basic HA (tolerate 1 failure)
  # ═══════════════════════════════════════════════════════════════════════════

  email:
    replicas: 2
  recommendation:
    replicas: 2
  currency:
    replicas: 2
  shipping:
    replicas: 2
  ad:
    replicas: 2
  accounting:
    replicas: 2
  fraud-detection:
    replicas: 2
  quote:
    replicas: 2

  # Tier 3 — platform
  flagd:
    replicas: 2  # Feature flag service should be HA in prod

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 4 — Load generator DISABLED in prod
  # Enable explicitly for controlled load tests only
  # ═══════════════════════════════════════════════════════════════════════════

  load-generator:
    enabled: false

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA STORES — HA configuration
  # ═══════════════════════════════════════════════════════════════════════════

  valkey-cart:
    replicas: 1  # Upstream demo uses single Valkey — Phase 8 considers Redis Sentinel

  kafka:
    replicas: 1  # Single-node for cost control — Phase 8 considers multi-broker

# Shared platform observability is inherited from base.yaml.
