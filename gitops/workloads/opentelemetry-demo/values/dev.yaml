# =============================================================================
# gitops/workloads/opentelemetry-demo/values/dev.yaml
#
# Dev environment overrides — layered on top of base.yaml.
# Goal: Fast iteration, full feature set visible, cost-efficient.
#
# Key characteristics:
#   - Single replica for all services (no HA needed in dev)
#   - Load generator ENABLED — generates traffic for observability
#   - Shared platform observability; no duplicate embedded stack
#   - Minimal resource requests to fit on 2× e2-standard-2 nodes
# =============================================================================

default:
  envOverrides:
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name=dev,service.namespace=opentelemetry-demo"

components:
  # ─── Tier 1 — single replicas in dev ─────────────────────────────────────
  frontend:
    replicas: 1
  frontend-proxy:
    replicas: 1
  cart:
    replicas: 1
  checkout:
    replicas: 1
  payment:
    replicas: 1
  product-catalog:
    replicas: 1

  # ─── Tier 2 — single replicas ─────────────────────────────────────────────
  email:
    replicas: 1
  recommendation:
    replicas: 1
  currency:
    replicas: 1
  shipping:
    replicas: 1
  ad:
    replicas: 1
  accounting:
    replicas: 1
  fraud-detection:
    replicas: 1
  quote:
    replicas: 1

  # ─── Tier 3 — platform ────────────────────────────────────────────────────
  flagd:
    replicas: 1
    envOverrides:
      - name: FLAGD_LOG_LEVEL
        value: debug

  # ─── Tier 4 — load generator (disabled) ──────────────────────────────────
  load-generator:
    enabled: false

  # ─── Data stores ──────────────────────────────────────────────────────────
  valkey-cart:
    replicas: 1
  kafka:
    replicas: 1

# The shared platform stack is configured in gitops/{kube-prometheus-stack,
# loki,tempo,otel-collector}; the base values keep upstream sub-charts disabled.
