# =============================================================================
# gitops/workloads/opentelemetry-demo/values/dev.yaml
#
# Dev environment overrides — layered on top of base.yaml.
# Goal: Fast iteration, full feature set visible, cost-efficient.
#
# Key characteristics:
#   - Single replica for all services (no HA needed in dev)
#   - Complete Locust traffic profile: 50 users, 5 users/second, HTTP-only
#   - Shared platform observability; no duplicate embedded stack
#   - Product reviews and the local mock LLM are enabled because the upstream
#     Locust workload exercises both routes during normal traffic.
# =============================================================================

default:
  envOverrides:
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name=dev,service.namespace=opentelemetry-demo"

components:
  # Optional Demo 2.2.0 services required by the upstream Locust routes.
  # The LLM image is a local mock implementation, so no GPU, API key, or
  # external model service is required.
  llm:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    schedulingRules:
      nodeSelector:
        workload: general

  product-reviews:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    schedulingRules:
      nodeSelector:
        workload: general

  # ─── Tier 1 — single replicas in dev ─────────────────────────────────────
  frontend:
    replicas: 1
  frontend-proxy:
    replicas: 1
  cart:
    replicas: 1
  checkout:
    replicas: 1
  payment:
    replicas: 1
  product-catalog:
    replicas: 1

  # ─── Tier 2 — single replicas ─────────────────────────────────────────────
  email:
    replicas: 1
  recommendation:
    replicas: 1
  currency:
    replicas: 1
  shipping:
    replicas: 1
  ad:
    replicas: 1
  accounting:
    replicas: 1
  fraud-detection:
    replicas: 1
  quote:
    replicas: 1

  # ─── Tier 3 — platform ────────────────────────────────────────────────────
  flagd:
    replicas: 1
    envOverrides:
      - name: FLAGD_LOG_LEVEL
        value: debug

  # ─── Tier 4 — upstream Locust load generator ──────────────────────────────
  # Keep browser workers disabled: the regular HTTP workflows cover browse,
  # cart, and checkout without Playwright's substantial resource overhead.
  load-generator:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        # Preserve the upstream chart's memory ceiling for the 50-user profile.
        memory: 1500Mi
    envOverrides:
      - name: LOCUST_USERS
        value: "50"
      - name: LOCUST_SPAWN_RATE
        value: "5"
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "false"

  # ─── Data stores ──────────────────────────────────────────────────────────
  valkey-cart:
    replicas: 1
  kafka:
    replicas: 1

# The shared platform stack is configured in gitops/{kube-prometheus-stack,
# loki,tempo,otel-collector}; the base values keep upstream sub-charts disabled.
