# =============================================================================
# gitops/applications/opentelemetry-demo/values/dev.yaml
#
# Dev environment overrides — layered on top of base.yaml.
# Goal: Fast iteration, full feature set visible, cost-efficient.
#
# Key characteristics:
#   - Single replica for all services (no HA needed in dev)
#   - Load generator ENABLED — generates traffic for observability
#   - Observability sub-charts ENABLED only here (disabled in base.yaml
#     to prevent ClusterRole naming conflicts across environments)
#   - Minimal resource requests to fit on 2× e2-standard-4 nodes
# =============================================================================

components:
  # ─── Tier 1 — single replicas in dev ─────────────────────────────────────
  frontend:
    replicas: 1
  frontend-proxy:
    replicas: 1
  cart:
    replicas: 1
  checkout:
    replicas: 1
  payment:
    replicas: 1
  # product-catalog in v0.40.9 requires PostgreSQL (DB_CONNECTION_STRING).
  # We disabled postgresql to save resources → product-catalog cannot start.
  # Re-enable both when dedicated DB infrastructure is provisioned (Phase 8).
  product-catalog:
    enabled: false

  # ─── Tier 2 — single replicas ─────────────────────────────────────────────
  email:
    replicas: 1
  recommendation:
    replicas: 1
  currency:
    replicas: 1
  shipping:
    replicas: 1
  ad:
    replicas: 1
  accounting:
    replicas: 1
  fraud-detection:
    replicas: 1
  quote:
    replicas: 1

  # ─── Tier 3 — platform ────────────────────────────────────────────────────
  flagd:
    replicas: 1
    envOverrides:
      - name: FLAGD_LOG_LEVEL
        value: debug

  # ─── Tier 4 — load generator on spot node ─────────────────────────────────
  load-generator:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi   # Locust/Python needs ~200-300Mi; upstream has no default limit
    envOverrides:
      - name: LOCUST_SPAWN_RATE
        value: "1"
      - name: LOCUST_USERS
        value: "5"    # Reduced — cluster has limited headroom
      - name: LOCUST_HOST
        value: "http://otel-demo-frontend-proxy:8080"

  # ─── Data stores ──────────────────────────────────────────────────────────
  valkey-cart:
    replicas: 1
  kafka:
    replicas: 1

# ─── Observability Sub-charts — enabled for dev ONLY ─────────────────────────
# Re-enables what base.yaml disables. Only deployed in this single dev
# environment to avoid ClusterRole name collisions across environments.
# Resources are lean to fit within 2× e2-standard-4 node capacity.

opentelemetry-collector:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  enabled: true
  server:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    persistentVolume:
      enabled: false   # No persistence in dev — saves cost and PVC provisioning time

grafana:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: false     # Stateless in dev — dashboards reload from configmaps
  adminPassword: "admin"

jaeger:
  enabled: true
  allInOne:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi

opensearch:
  enabled: false  # Too heavy (~1GB RAM) for dev nodes
