# =============================================================================
# gitops/applications/opentelemetry-demo/values/stage.yaml
#
# Staging environment overrides — layered on top of base.yaml.
# Goal: Production-like validation with HA for Tier 1 services.
#
# Key characteristics:
#   - 2 replicas for Tier 1 services (basic HA validation)
#   - PDBs on Tier 1 (minAvailable: 1 — tolerate 1 pod down)
#   - Load generator enabled for realistic load testing
#   - Full observability stack enabled with persistence
# =============================================================================

components:
  # Tier 1 — 2 replicas for HA validation
  frontend:
    replicas: 2
  frontend-proxy:
    replicas: 2
  cart:
    replicas: 2
  checkout:
    replicas: 2
  payment:
    replicas: 2
  product-catalog:
    replicas: 2

  # Tier 2 — single replica (tolerate brief disruption)
  email:
    replicas: 1
  recommendation:
    replicas: 1
  currency:
    replicas: 1
  shipping:
    replicas: 1
  ad:
    replicas: 1
  accounting:
    replicas: 1
  fraud-detection:
    replicas: 1
  quote:
    replicas: 1

  # Tier 3 — platform (single, stable)
  flagd:
    replicas: 1

  # Tier 4 — load generator ENABLED for load testing
  load-generator:
    enabled: true
    replicas: 1
    envOverrides:
      - name: LOCUST_SPAWN_RATE
        value: "5"   # 5 new users/second
      - name: LOCUST_USERS
        value: "50"  # 50 concurrent users — realistic load test
      - name: LOCUST_HOST
        value: "http://otel-demo-frontend-proxy:8080"

  # Data stores
  valkey-cart:
    replicas: 1
  kafka:
    replicas: 1

# Observability — all enabled in stage
grafana:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi

jaeger:
  enabled: true

prometheus:
  enabled: true
  server:
    persistentVolume:
      enabled: true
      size: 20Gi

opensearch:
  enabled: false  # Enable when log pipeline is configured in Phase 8
