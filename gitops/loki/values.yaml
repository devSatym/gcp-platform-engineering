# Single-binary Loki is deliberate for this portfolio-sized platform. The
# interface remains standard Loki and can be scaled to a distributed topology
# with object storage without changing workload integration.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  storage:
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    retention_period: 336h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 20Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Self-observability is platform-owned. The dashboards are discovered by the
# shared Grafana sidecar, while metrics and rules are evaluated by the shared
# Prometheus instance.
monitoring:
  dashboards:
    enabled: true
    namespace: observability
    labels:
      grafana_dashboard: "1"
  rules:
    enabled: true
    labels:
      release: kube-prometheus-stack
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 30s
