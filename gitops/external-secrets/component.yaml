component:
  name: external-secrets
  namespace: platform-system
  syncWave: "0"
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.12.1"
  values: gitops/external-secrets/values.yaml
  # The GSA identity belongs to each environment. The platform ApplicationSet
  # renders this Helm parameter from environment.workloadIdentity.
  helmParameters:
    - name: serviceAccount.annotations.iam\\.gke\\.io/gcp-service-account
      environmentValue: externalSecretsServiceAccount
