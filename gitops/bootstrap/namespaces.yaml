# =============================================================================
# gitops/bootstrap/namespaces.yaml
#
# All platform namespaces managed declaratively.
# Sync Wave -2: namespaces must exist before any other resource.
#
# Creating namespaces in Git means:
#   - Labels are version-controlled
#   - ArgoCD recreates them if accidentally deleted (self-heal)
#   - Future Istio injection labels are set here (Phase 9)
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: platform
    # Istio injection enabled in Phase 9
    # istio-injection: enabled

---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: networking
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: platform

---
apiVersion: v1
kind: Namespace
metadata:
  name: applications
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: application
    # Istio injection enabled in Phase 9
    # istio-injection: enabled

