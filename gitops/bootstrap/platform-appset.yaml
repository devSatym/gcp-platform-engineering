apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/replace-with-owner/replace-with-repository.git
              revision: main
              files:
                - path: gitops/*/component.yaml
          - git:
              repoURL: https://github.com/replace-with-owner/replace-with-repository.git
              revision: main
              files:
                - path: gitops/environments/*/config.yaml
  template:
    metadata:
      name: "{{.component.name}}-{{.environment.name}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: platform
        platform.component: "{{.component.name}}"
        environment: "{{.environment.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{.component.syncWave}}"
    spec:
      project: platform
      sources:
        - repoURL: "{{.component.source.repoURL}}"
          chart: "{{.component.source.chart}}"
          targetRevision: "{{.component.source.targetRevision}}"
          helm:
            releaseName: "{{.component.name}}"
            valueFiles:
              - "$values/{{.component.values}}"
        - repoURL: "{{.environment.gitopsRepository}}"
          targetRevision: main
          ref: values
      destination:
        server: "{{.environment.server}}"
        namespace: "{{.component.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
