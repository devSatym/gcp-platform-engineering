apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Platform applications normally own their resources and may prune them when
  # their component configuration is removed.
  syncPolicy:
    preserveResourcesOnDeletion: false
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/devSatym/gcp-platform-engineering.git
              revision: main
              files:
                - path: gitops/*/component.yaml
          - git:
              repoURL: https://github.com/devSatym/gcp-platform-engineering.git
              revision: main
              files:
                # This Argo CD instance manages the dev cluster only. Add
                # dedicated cluster registration before enabling other files.
                - path: gitops/environments/dev/config.yaml
  template:
    metadata:
      name: "{{.component.name}}-{{.environment.name}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: platform
        platform.component: "{{.component.name}}"
        environment: "{{.environment.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{.component.syncWave}}"
    spec:
      project: platform
      sources:
        - repoURL: "{{.component.source.repoURL}}"
          chart: "{{.component.source.chart}}"
          targetRevision: "{{.component.source.targetRevision}}"
          helm:
            releaseName: "{{.component.name}}"
            valueFiles:
              - "$values/{{.component.values}}"
        - repoURL: "{{.environment.gitopsRepository}}"
          targetRevision: main
          ref: values
      destination:
        server: "{{.environment.server}}"
        namespace: "{{.component.namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Preserve fields explicitly listed in an application's
          # ignoreDifferences rules during sync. This is needed for generated
          # credentials backed by persistent application state.
          - RespectIgnoreDifferences=true
          # CRD-owning charts and their custom resources can be installed in
          # one reconciliation without a first-sync dry-run race.
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
  # Conditional fields belong in templatePatch so the ApplicationSet itself
  # remains valid YAML before its Go template is rendered.
  templatePatch: |
    spec:
      sources:
        - repoURL: "{{.component.source.repoURL}}"
          chart: "{{.component.source.chart}}"
          targetRevision: "{{.component.source.targetRevision}}"
          helm:
            releaseName: "{{.component.name}}"
            valueFiles:
              - "$values/{{.component.values}}"
            {{- with (index .component "helmParameters") }}
            parameters:
              {{- range . }}
              - name: "{{.name}}"
                value: "{{index $.environment.workloadIdentity .environmentValue}}"
                forceString: true
              {{- end }}
            {{- end }}
        - repoURL: "{{.environment.gitopsRepository}}"
          targetRevision: main
          ref: values
      {{- if .environment.policy.automatedSync }}
      syncPolicy:
        automated:
          prune: {{.environment.policy.prune}}
          selfHeal: {{.environment.policy.selfHeal}}
      {{- end }}
      {{- with (index .component "ignoreDifferences") }}
      ignoreDifferences:
        {{- range . }}
        - group: "{{ .group }}"
          kind: "{{ .kind }}"
          name: "{{ .name }}"
          namespace: "{{ .namespace }}"
          jsonPointers:
            {{- range .jsonPointers }}
            - "{{ . }}"
            {{- end }}
        {{- end }}
      {{- end }}
