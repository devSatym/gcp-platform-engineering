# =============================================================================
# gitops/bootstrap/platform-appset.yaml
#
# ApplicationSet that generates platform component Applications per environment.
#
# SINGLE-CLUSTER ARCHITECTURE NOTE:
#   Platform manages cluster-scoped resources (PriorityClasses, ESO CRDs,
#   metrics-server APIService). On a single cluster, only ONE platform app
#   can own these resources — multiple apps fight via SSA field managers
#   and cause permanent OutOfSync.
#
#   Current: dev only (single GKE cluster)
#   Future:  Add stage/prod when dedicated clusters are provisioned
#            (Phase 16+ multi-cluster with ArgoCD cluster secrets)
#
# Sync Wave -1: AppSets create Applications, which must exist before they sync.
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # ─── Generator: List ────────────────────────────────────────────────────────
  # Single environment on single cluster.
  # To add stage/prod: provision separate GKE clusters and add entries here
  # with their respective server URLs from ArgoCD cluster secrets.
  generators:
    - list:
        elements:
          - env: dev
            server: https://kubernetes.default.svc
          # stage and prod are commented out until dedicated clusters exist.
          # Enabling them on a single cluster causes:
          #   1. SSA field manager conflicts on cluster-scoped resources
          #   2. Permanent OutOfSync on PriorityClasses, ESO, metrics-server
          # - env: stage
          #   server: https://<stage-cluster-endpoint>
          # - env: prod
          #   server: https://<prod-cluster-endpoint>

  # ─── Template: Application per environment ──────────────────────────────────
  template:
    metadata:
      name: "platform-{{env}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: platform
        environment: "{{env}}"
    spec:
      project: platform
      source:
        repoURL: "https://github.com/devSatym/gcp-platform-engineering.git"
        targetRevision: main
        path: gitops/platform
      destination:
        server: "{{server}}"
        namespace: platform-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
