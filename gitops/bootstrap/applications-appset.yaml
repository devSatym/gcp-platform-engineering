# =============================================================================
# gitops/bootstrap/applications-appset.yaml
#
# ApplicationSet that generates one OTel Demo Application per environment.
#
# SINGLE-CLUSTER ARCHITECTURE NOTE:
#   OTel Demo sub-charts (Grafana, Prometheus, Jaeger, OTel Collector) install
#   cluster-scoped ClusterRoles with FIXED names (grafana-clusterrole, etc.).
#   On a single cluster, deploying to multiple environments creates naming
#   conflicts — ArgoCD marks apps as Degraded with SharedResourceWarning.
#
#   Current: dev only (single GKE cluster)
#   Future:  Add stage/prod when dedicated clusters are provisioned
#
# The multi-source pattern (ArgoCD 2.6+) allows combining:
#   - The upstream Helm chart from ArtifactHub
#   - Our custom values files from the monorepo
# Without forking or copying the upstream chart.
#
# Sync Wave 2: Business applications deploy after all platform components
# (ESO, metrics-server, priority-classes) are healthy.
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # ─── Generator: List ────────────────────────────────────────────────────────
  # Single environment on single cluster.
  # Stage/prod require separate clusters to avoid ClusterRole name collisions.
  generators:
    - list:
        elements:
          - env: dev
            server: https://kubernetes.default.svc
            chartVersion: "0.40.9"
          # stage and prod require dedicated clusters. Enabling on a single cluster:
          #   1. sub-chart ClusterRoles collide (grafana-clusterrole, prometheus, etc.)
          #   2. ArgoCD marks apps Degraded with SharedResourceWarning
          #   3. 3x resource pressure exhausts node CPU (99% utilized)
          # - env: stage
          #   server: https://<stage-cluster-endpoint>
          #   chartVersion: "0.40.9"
          # - env: prod
          #   server: https://<prod-cluster-endpoint>
          #   chartVersion: "0.40.9"

  # ─── Template ───────────────────────────────────────────────────────────────
  template:
    metadata:
      name: "otel-demo-{{env}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: applications
        environment: "{{env}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io

    spec:
      project: applications

      # Multi-source: upstream chart + our values overlay from the monorepo
      sources:
        # Source 1: Upstream OTel Demo Helm chart
        - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
          chart: opentelemetry-demo
          targetRevision: "{{chartVersion}}"
          helm:
            releaseName: otel-demo
            valueFiles:
              # $values references the second source (our monorepo)
              - $values/gitops/applications/opentelemetry-demo/values/base.yaml
              - $values/gitops/applications/opentelemetry-demo/values/{{env}}.yaml

        # Source 2: Our monorepo provides the values files above
        - repoURL: "https://github.com/devSatym/gcp-platform-engineering.git"
          targetRevision: main
          ref: values   # Declares this source as a $values reference

      destination:
        server: "{{server}}"
        namespace: "otel-demo-{{env}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m

      # ─── IgnoreDifferences ──────────────────────────────────────────────────
      # Prevents ArgoCD from marking apps Degraded due to K8s API fields
      # not declared in ArgoCD's internal schema (e.g. .status.terminatingReplicas).
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /status
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /status
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/clusterIPs

  # ─── Strategy ───────────────────────────────────────────────────────────────
  syncPolicy:
    applicationsSync: create-update
