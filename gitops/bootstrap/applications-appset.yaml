apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/devSatym/gcp-platform-engineering.git
              revision: main
              files:
                - path: gitops/workloads/*/workload.yaml
          - git:
              repoURL: https://github.com/devSatym/gcp-platform-engineering.git
              revision: main
              files:
                # This Argo CD instance manages the dev cluster only. Add
                # dedicated cluster registration before enabling other files.
                - path: gitops/environments/dev/config.yaml
  template:
    metadata:
      name: "{{.workload.name}}-{{.environment.name}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: workloads
        workload.name: "{{.workload.name}}"
        environment: "{{.environment.name}}"
        platform.features/progressive-delivery: "{{.workload.progressiveDelivery.enabled}}"
        platform.features/observability: "{{.workload.observability.enabled}}"
        platform.features/external-secrets: "{{.workload.secrets.enabled}}"
        platform.hostname/enabled: "{{.workload.hostname.enabled}}"
        platform.hostname/value: "{{.workload.hostname.value}}"
        platform.network/exposure: "{{.workload.network.exposure}}"
        platform.network/ingress-enabled: "{{.workload.network.ingress.enabled}}"
        platform.network/gateway-class: "{{.workload.network.ingress.gatewayClass}}"
        platform.observability/metrics: "{{.workload.observability.metrics}}"
        platform.observability/logs: "{{.workload.observability.logs}}"
        platform.observability/traces: "{{.workload.observability.traces}}"
        platform.progressive-delivery/strategy: "{{.workload.progressiveDelivery.strategy}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{.workload.syncWave}}"
    spec:
      project: workloads
      sources:
        - repoURL: "{{.workload.source.repoURL}}"
          chart: "{{.workload.source.chart}}"
          path: "{{.workload.source.path}}"
          targetRevision: "{{.workload.source.targetRevision}}"
          helm:
            releaseName: "{{.workload.name}}"
            valueFiles:
              - "$values/{{.workload.values.common}}"
              - "$values/{{index .workload.values.environments .environment.name}}"
        - repoURL: "{{.environment.gitopsRepository}}"
          targetRevision: main
          ref: values
      destination:
        server: "{{.environment.server}}"
        namespace: "{{(index .workload.destinations .environment.name).namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /status
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /status
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/clusterIPs
  templatePatch: |
    {{- if .environment.policy.automatedSync }}
    spec:
      syncPolicy:
        automated:
          prune: {{.environment.policy.prune}}
          selfHeal: {{.environment.policy.selfHeal}}
    {{- end }}
  syncPolicy:
    applicationsSync: create-update
