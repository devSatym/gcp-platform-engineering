apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/replace-with-owner/replace-with-repository.git
        revision: main
        files:
          - path: gitops/environments/*/config.yaml
  template:
    metadata:
      name: "platform-core-{{.environment.name}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: platform
        platform.component: core
        environment: "{{.environment.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform
      source:
        repoURL: "{{.environment.gitopsRepository}}"
        targetRevision: main
        path: gitops/platform
      destination:
        server: "{{.environment.server}}"
        namespace: platform-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
