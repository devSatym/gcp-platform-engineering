apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/devSatym/gcp-platform-engineering.git
        revision: main
        files:
          # This Argo CD instance manages the dev cluster only. Add another
          # cluster registration and a dedicated ApplicationSet before
          # enabling staging or production here.
          - path: gitops/environments/dev/config.yaml
  template:
    metadata:
      name: "platform-core-{{.environment.name}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: platform
        platform.component: core
        environment: "{{.environment.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform
      source:
        repoURL: "{{.environment.gitopsRepository}}"
        targetRevision: main
        path: gitops/platform
      destination:
        server: "{{.environment.server}}"
        namespace: platform-system
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
  templatePatch: |
    {{- if .environment.policy.automatedSync }}
    spec:
      syncPolicy:
        automated:
          prune: {{.environment.policy.prune}}
          selfHeal: {{.environment.policy.selfHeal}}
    {{- end }}
