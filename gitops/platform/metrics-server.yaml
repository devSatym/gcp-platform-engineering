# =============================================================================
# gitops/platform/metrics-server.yaml
#
# Metrics Server — aggregates CPU and memory metrics from kubelets.
# Required for:
#   - Horizontal Pod Autoscaler (HPA): kubectl top pods, kubectl top nodes
#   - Vertical Pod Autoscaler (VPA): resource recommendations
#
# GKE typically pre-installs metrics-server, but managing it via ArgoCD:
#   - Ensures version is tracked in Git
#   - Allows customization (e.g., --kubelet-insecure-tls on private clusters)
#   - Drift is auto-corrected if someone removes it manually
#
# Sync Wave 1: controller-level component, must come after operators
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: platform

  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: "3.12.2"

    helm:
      releaseName: metrics-server
      valuesObject:
        # GKE private cluster: kubelet serves on private IPs with self-signed certs
        args:
          - --kubelet-insecure-tls
          - --kubelet-preferred-address-types=InternalIP

        # Node scheduling: system pool
        tolerations:
          - key: "workload"
            operator: "Equal"
            value: "system"
            effect: "NoSchedule"
        nodeSelector:
          workload: system

        # Resource limits — metrics-server is lightweight
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

  # Prevents ComparisonError: ".status.terminatingReplicas: field not declared in schema"
  # Also skips APIService status which GKE manages independently.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
    - group: apiregistration.k8s.io
      kind: APIService
      jsonPointers:
        - /status

