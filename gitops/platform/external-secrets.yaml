# =============================================================================
# gitops/platform/external-secrets.yaml
#
# External Secrets Operator (ESO) managed by ArgoCD.
#
# ESO reads secrets from GCP Secret Manager and syncs them into Kubernetes
# Secrets. This eliminates hardcoded credentials from manifests and GitOps repos.
#
# Flow:
#   GCP Secret Manager → ESO (via Workload Identity) → K8s Secret → Pod
#
# The GCP SA (sa-external-secrets) was created in Phase 2.
# The Workload Identity binding was created in Phase 4 Terraform module.
#
# Sync Wave 0: Operators must install before their CRs (ExternalSecret, SecretStore)
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: platform

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.12.1"   # Pin — verify latest at: https://github.com/external-secrets/external-secrets/releases

    helm:
      releaseName: external-secrets
      valuesObject:
        # Install CRDs via Helm — ArgoCD handles drift detection for them
        installCRDs: true

        # Workload Identity: annotate the K8s SA so GKE metadata server
        # can exchange the OIDC token for a GCP access token.
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            # !! UPDATE PROJECT_ID !!
            iam.gke.io/gcp-service-account: "sa-external-secrets@YOUR_PROJECT_ID.iam.gserviceaccount.com"

        # Node scheduling: run on system pool
        tolerations:
          - key: "workload"
            operator: "Equal"
            value: "system"
            effect: "NoSchedule"
        nodeSelector:
          workload: system

        # Webhook
        webhook:
          tolerations:
            - key: "workload"
              operator: "Equal"
              value: "system"
              effect: "NoSchedule"
          nodeSelector:
            workload: system

        # Cert Controller
        certController:
          tolerations:
            - key: "workload"
              operator: "Equal"
              value: "system"
              effect: "NoSchedule"
          nodeSelector:
            workload: system

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
