# =============================================================================
# .yamllint.yaml
#
# YAML lint configuration for the ci.yaml yamllint step.
# See: https://yamllint.readthedocs.io/en/stable/configuration.html
# =============================================================================

extends: default

rules:
  line-length:
    max: 150
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # ArgoCD and Kubernetes manifests commonly use truthy values like 'yes'/'no'
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
    check-keys: false

  # Long comments are acceptable in documentation-heavy YAML
  comments:
    min-spaces-from-content: 1
    level: warning

  # ArgoCD annotation keys look like 'annotations:' followed by block mapping
  comments-indentation: disable

  # Allow multiple blank lines in YAML (common for grouping)
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

  # Braces: allow single-line flow mappings
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Brackets: allow single-line flow sequences
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

ignore: |
  .terraform/
  node_modules/
  .git/
  **/.gemini/
