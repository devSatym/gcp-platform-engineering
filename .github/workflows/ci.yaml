# =============================================================================
# .github/workflows/ci.yaml
#
# CI — Pull Request Validation
#
# Runs on every PR to main. Purpose: catch mistakes before merge.
# No images are built in this workflow.
#
# Jobs:
#   1. lint        — YAML, Markdown, Helm, Dockerfile
#   2. tf-validate — Terraform format and validate
#   3. secret-scan — Gitleaks credential scanning
# =============================================================================

name: CI — Pull Request Validation

on:
  pull_request:
    branches:
      - main
  # Allow manual triggers for debugging
  workflow_dispatch:

# Cancel in-progress runs for the same PR to avoid redundant work
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint — YAML, Markdown, Helm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # YAML Linting — validates gitops manifests and GitHub Actions workflows
      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yaml gitops/ .github/workflows/

      - name: Validate GitOps contracts
        run: |
          python3 scripts/validate-gitops-contracts.py
          bash -n scripts/*.sh bootstrap/*.sh

      # Helm values validation
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Validate workload values
        run: |
          python3 - <<"PY"
          import pathlib, yaml
          files = sorted(pathlib.Path("gitops/workloads").glob("*/values/*.yaml"))
          for path in files:
              with path.open() as stream:
                  yaml.safe_load(stream)
              print(f"  ✓ {path}")
          print(f"Validated {len(files)} workload values files")
          PY

      # Markdown linting — keeps docs consistent
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.terraform/**

  # ─── Job 2: Terraform Validation ─────────────────────────────────────────────
  tf-validate:
    name: Terraform — Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: 'v0.50.3'

      - name: TFLint — modules
        run: |
          for module in terraform/modules/*/; do
            echo "--- Linting $module ---"
            cd $module
            tflint --init
            tflint
            cd -

      # Validate each environment (without real GCP credentials)
      - name: Terraform Init + Validate (dev)
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Checkov — Security scan on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true  # Warn, don't fail — allows gradual hardening

  # ─── Job 3: Secret Scanning ───────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning — Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git-based scanning

      - name: Gitleaks — Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scan git history, not just working tree
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional for org scans

  # ─── Summary badge ────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, tf-validate, secret-scan]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed" && exit 1
          fi
          if [[ "${{ needs.tf-validate.result }}" != "success" ]]; then
            echo "❌ Terraform validation failed" && exit 1
          fi
          if [[ "${{ needs.secret-scan.result }}" != "success" ]]; then
            echo "❌ Secret scan failed" && exit 1
          fi
          echo "✅ All CI checks passed"
