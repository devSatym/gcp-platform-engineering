name: CI — Platform Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitops_validate:
    name: GitOps — Lint and Render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python dependencies
        run: python3 -m pip install --disable-pip-version-check yamllint==1.37.1 PyYAML==6.0.2

      - name: Lint GitOps and workflow YAML
        run: yamllint -c .yamllint.yaml gitops/ .github/workflows/

      - name: Validate GitOps contracts and shell scripts
        run: |
          python3 scripts/validate-gitops-contracts.py
          bash -n scripts/*.sh bootstrap/*.sh

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Render OpenTelemetry Demo dev configuration
        run: scripts/validate-opentelemetry-demo.sh

      - name: Set up kubectl for Kustomize rendering
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Render workload-owned manifests
        run: kubectl kustomize gitops/workloads/opentelemetry-demo/manifests/dev >/dev/null

  terraform_validate:
    name: Terraform — Format, Validate, and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Validate Terraform environments and modules
        run: |
          for directory in terraform/environments/* terraform/modules/*; do
            echo "--- Terraform validate: ${directory} ---"
            terraform -chdir="${directory}" init -backend=false -input=false
            terraform -chdir="${directory}" validate
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Lint Terraform environments and modules
        run: |
          for directory in terraform/environments/* terraform/modules/*; do
            echo "--- TFLint: ${directory} ---"
            (
              cd "${directory}"
              tflint --init
              tflint --format compact
            )
          done

      - name: Scan Terraform for security misconfigurations
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

  secret_scan:
    name: Secret scanning — Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci_complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - gitops_validate
      - terraform_validate
      - secret_scan
    if: always()

    steps:
      - name: Report validation result
        run: |
          test "${{ needs.gitops_validate.result }}" = "success"
          test "${{ needs.terraform_validate.result }}" = "success"
          test "${{ needs.secret_scan.result }}" = "success"
          echo "Platform validation completed successfully."
