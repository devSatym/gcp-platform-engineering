name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform Plan — ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_ENVIRONMENT: ${{ inputs.environment }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify workflow configuration
        run: |
          for variable in TF_STATE_BUCKET GCP_WIF_PROVIDER GCP_SA_EMAIL; do
            if [[ -z "${!variable}" ]]; then
              echo "::error title=Missing GitHub Actions variable::Set ${variable} before running Terraform plans. See docs/CI.md."
              exit 1
            fi
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}
          create_credentials_file: true

      - name: Initialize Terraform state
        working-directory: terraform/environments/${{ env.TF_ENVIRONMENT }}
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Create Terraform plan
        id: plan
        working-directory: terraform/environments/${{ env.TF_ENVIRONMENT }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode >plan-output.txt 2>&1
          plan_exit_code=$?
          set -e

          cat plan-output.txt
          case "${plan_exit_code}" in
            0|2)
              echo "exit_code=${plan_exit_code}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "${plan_exit_code}"
              ;;
          esac

      - name: Publish plan summary
        working-directory: terraform/environments/${{ env.TF_ENVIRONMENT }}
        run: |
          {
            echo "## Terraform plan — ${TF_ENVIRONMENT}"
            if [[ "${{ steps.plan.outputs.exit_code }}" == "0" ]]; then
              echo "No infrastructure changes detected."
            else
              echo "Infrastructure changes detected. A maintainer must review and apply them manually."
            fi
            echo
            echo '```hcl'
            sed -n '1,1200p' plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record manual apply requirement
        run: |
          echo "Terraform apply is intentionally not part of this workflow."
