# =============================================================================
# .github/workflows/security.yaml
#
# Supply Chain Security — SBOM, Vulnerability Scan, Image Signing, Provenance
#
# Runs after build.yaml completes successfully.
# This workflow closes the software supply chain:
#
#   Image built → SBOM generated → Scanned → Signed → Provenance attached
#
# Tools:
#   Syft    — SBOM generation (CycloneDX format)
#   Trivy   — Vulnerability scanning (OS packages + language dependencies)
#   Cosign  — Keyless image signing (Sigstore Fulcio OIDC — no key management)
#   attest  — SLSA provenance attestation
# =============================================================================

name: Supply Chain Security

on:
  # Triggered after build workflow completes
  workflow_run:
    workflows: ["Build & Publish"]
    types:
      - completed
  # Allow manual trigger for re-scanning existing images
  workflow_dispatch:
    inputs:
      image:
        description: 'Full image reference to scan (e.g., asia-south1-docker.pkg.dev/project/repo/service:sha-abc1234)'
        required: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev

jobs:
  # Only run if the triggering build workflow succeeded
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write        # Attach attestations
      id-token: write        # WIF OIDC + Cosign keyless signing
      security-events: write # Upload SARIF to GitHub Security tab
      packages: write        # Sign images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Authenticate to GCP ─────────────────────────────────────────────
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # ─── Determine image to scan ─────────────────────────────────────────
      - name: Determine image to scan
        id: image
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          if [[ -z "${REQUESTED_IMAGE}" ]]; then
            echo "A full image reference is required for a manual or workflow-run scan" >&2
            exit 1
          fi
          echo "image=${REQUESTED_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Scanning image: ${REQUESTED_IMAGE}"
      # ─── SBOM Generation (Syft) ──────────────────────────────────────────
      # Software Bill of Materials: complete inventory of all packages in the image
      # Stored as CycloneDX JSON + SPDX for maximum compatibility
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          artifact-name: sbom-cyclonedx

      - name: Generate SBOM (SPDX)
        run: |
          syft scan ${{ steps.image.outputs.image }} -o spdx-json > sbom.spdx.json
          echo "SBOM package count: $(jq '.packages | length' sbom.spdx.json)"

      # ─── Vulnerability Scanning (Trivy) ──────────────────────────────────
      # Policy: CRITICAL → fail build, HIGH → warn, MEDIUM/LOW → report only
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.50.1

      - name: Trivy — vulnerability scan (SARIF for GitHub Security tab)
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            ${{ steps.image.outputs.image }}

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Trivy — fail on CRITICAL vulnerabilities
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --no-progress \
            ${{ steps.image.outputs.image }}
        # HIGH severity: warn only (informational)

      - name: Trivy — report HIGH vulnerabilities (warn)
        if: always()
        run: |
          HIGH_COUNT=$(trivy image \
            --severity HIGH \
            --format json \
            --no-progress \
            ${{ steps.image.outputs.image }} | jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="HIGH")] | length')
          echo "⚠️ HIGH severity vulnerabilities: ${HIGH_COUNT}"
          echo "high_vuln_count=${HIGH_COUNT}" >> $GITHUB_ENV

      # ─── Image Signing (Cosign — Keyless) ────────────────────────────────
      # Cosign keyless signing uses Sigstore Fulcio OIDC:
      #   - No private key to manage
      #   - Signing identity = GitHub Actions OIDC token
      #   - Signature stored in Sigstore Rekor transparency log
      #   - Signature pushed alongside the image in Artifact Registry
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Sign image with Cosign (keyless)
        run: |
          # Sign the image digest (not just the tag — immutable reference)
          IMAGE_DIGEST=$(docker manifest inspect ${{ steps.image.outputs.image }} \
            --verbose 2>/dev/null | jq -r '.Descriptor.digest // empty' || \
            gcloud artifacts docker images describe ${{ steps.image.outputs.image }} \
            --format='value(image_summary.digest)' 2>/dev/null || echo "")
          if [[ -n "${IMAGE_DIGEST}" ]]; then
            IMAGE_REF="${{ steps.image.outputs.image }}@${IMAGE_DIGEST}"
            cosign sign --yes "${IMAGE_REF}"
            echo "⚠️ Could not determine image digest — signing skipped in dry-run"
          fi

      # ─── Attach SBOM as attestation ──────────────────────────────────────
      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            ${{ steps.image.outputs.image }} || echo "Attestation skipped (dry-run)"

      # ─── SLSA Provenance ─────────────────────────────────────────────────
      # Documents: source commit, workflow name, builder identity, timestamp
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.image }}
      - name: Security summary
        if: always()
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM (CycloneDX) | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM (SPDX) | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy CRITICAL | ${{ job.status == 'success' && '✅ None' || '❌ Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy HIGH | ⚠️ ${{ env.high_vuln_count }} found |" >> $GITHUB_STEP_SUMMARY
          echo "| Cosign signed | ✅ Keyless |" >> $GITHUB_STEP_SUMMARY
          echo "| SLSA provenance | ✅ Attached |" >> $GITHUB_STEP_SUMMARY
